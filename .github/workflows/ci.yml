name: Voice Calculator CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci-pipeline:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies from requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated pytest test suite
      - name: Run Pytest Unit Tests
        run: |
          pytest -v --junitxml=test-results.xml

      # Step 5: Check Python syntax using py_compile
      - name: Verify Python Syntax
        run: |
          python -m py_compile calculator.py tests/test_calculator.py

      # Step 6: Prepare distribution build directory
      - name: Prepare Build Directory
        run: |
          mkdir -p build
          cp index.html style.css script.js calculator.py requirements.txt README.md build/
          echo "Build directory prepared with contents:"
          ls -la build/

      # Step 7: Package build directory into a ZIP archive
      - name: Package Build into ZIP
        run: |
          zip -r voice-calculator-build.zip build/
          echo "Packaged zip size:"
          ls -lh voice-calculator-build.zip

      # Step 8: Upload the ZIP file as a GitHub Actions artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-release
          path: voice-calculator-build.zip
          retention-days: 14
